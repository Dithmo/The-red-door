<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>The Red Door</title>
    <meta
      name="description"
      content="A remake of The Red Door, a 1985 ZX Spectrum text adventure by Tartan Software."
    />
    <link rel="stylesheet" href="./src/ui/game.css" />
  </head>
  <body>
    <main id="game" class="game">
      <figure class="picture">
        <img id="picture" alt="" />
        <figcaption id="place">The Red Door</figcaption>
      </figure>

      <section class="pane">
        <div id="transcript" class="transcript" tabindex="0">
          <div id="turns" class="turns" aria-live="polite"></div>
        </div>

        <form id="prompt" class="prompt" autocomplete="off">
          <label class="caret" for="input" aria-label="Enter a command">&gt;</label>
          <input
            id="input"
            name="input"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="What to do now?"
          />
          <button type="button" id="undo" title="Take back the last move (Ctrl-Z)">
            Undo
          </button>
        </form>

        <p class="status">
          <span id="status-carry"></span>
          <span id="status-turn"></span>
          <span class="hint">Try <code>look</code>, <code>inventory</code>, <code>help</code></span>
        </p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
